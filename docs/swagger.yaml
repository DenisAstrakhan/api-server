          description: Успешное удоление пользователя
        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Удоляет пользователя
      tags:
      - users
    get:
      description: Возвращает пользователя по id
      parameters:
      - description: id возвращаемого пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно вернул пользователя
          schema:
            $ref: '#/definitions/users_transport_http.GetUserRespons'
        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Вщзвращает пользователя
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Изменение существующего пользователя по id
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано** phone_number игнорируется, значени в БД не меняется
        2. **Явно передано значение** "phone_number":"+78889997766" устанавливает новое значение в БД
        3. **Выставленно null** "phone_number":null значение удаляется из БД (set to null)
        Ограничение full_name не может быть null
      parameters:
      - description: PatchUser тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users_transport_http.PatchUserRequest'
      - description: id изменяемого пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно изменённый пользователей
          schema:
            $ref: '#/definitions/users_transport_http.PatchUserRespons'
        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Изменение пользователя
      tags:
      - users
