        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Создать пользователя
      tags:
      - users
  /users/{id}:
    delete:
      description: Удоляет пользователя по id
      parameters:
      - description: id удоляемого пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
