host: 127.0.0.1:5050
info:
  contact: {}
  description: REST-API scheme
  title: Golang API Server
  version: "1.0"
paths:
  /task:
    get:
      description: Возвращает список задачь. Опчианально по user_id пользователя,
        с пагинацией
      parameters:
      - description: id пользователя
        in: path
        name: user_id
        type: integer
      - description: Размер списка пользователей
        in: query
        name: limit
        type: integer
      - description: Смещение списка пользователей
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно вернул список задач
          schema:
            items:
              $ref: '#/definitions/tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Список задач
      tags:
      - tasks
  /tasks:
    post:
      consumes:
      - application/json
      description: Создать новую задачу в системе с привязкой к пользователю
      parameters:
      - description: CreateTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданная задача
          schema:
            $ref: '#/definitions/tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Author  not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удоляет задачу по id
      parameters:
      - description: id удоляемой задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Успешное удоление задачи
        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Удоляет задачу
      tags:
      - tasks
    get:
      description: Возвращает задачу по id
      parameters:
      - description: id возвращаемй звдвчи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно вернул задачу
          schema:
            $ref: '#/definitions/tasks_transport_http.GetTaskRespons'
        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Вщзвращает задачу
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: |-
        Изменение существующей задачи по id
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано** description игнорируется, значени в БД не меняется
        2. **Явно передано значение** "description":"Сделать Геометрия" устанавливает новое значение в БД
        3. **Выставленно null** "description":null значение удаляется из БД (set to null)
        Ограничение title и completed не может быть null
      parameters:
      - description: PatchTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tasks_transport_http.PatchTaskRequest'
      - description: id изменяемой задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно изменённая задача
          schema:
            $ref: '#/definitions/tasks_transport_http.PatchTaskRespons'
        "400":
          description: Bed request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Изменение задачи
      tags:
      - tasks
  /users:
